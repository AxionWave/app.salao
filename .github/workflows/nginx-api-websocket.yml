name: nginx da API - WebSocket

# Manual. "mostrar" só lê o site da API; "aplicar" liga o WebSocket no proxy (com cópia, nginx -t e volta automática).
on:
  workflow_dispatch:
    inputs:
      acao:
        description: mostrar ou aplicar
        required: true
        default: mostrar
        type: choice
        options:
          - mostrar
          - aplicar

concurrency:
  group: nginx-api
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: nginx na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACAO: ${{ inputs.acao }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          envs: ACAO
          script: |
            set -e
            SITE=$(grep -lE "server_name[^;]*[[:space:]]api\.lumensoft\.com\.br[[:space:];]" /etc/nginx/sites-enabled/* 2>/dev/null | head -1 || true)
            if [ -z "$SITE" ]; then echo "Site da API não encontrado em /etc/nginx/sites-enabled"; exit 1; fi
            echo "Arquivo: $SITE"
            mostrar() {
              sed -E 's/((secret|token|senha|password|passwd|key|auth)[^[:space:]]*[[:space:]]+).*/\1<oculto>;/I' "$1" | grep -nvE '^[[:space:]]*(#|$)'
            }
            if [ "$ACAO" = "mostrar" ]; then
              mostrar "$SITE"
              exit 0
            fi
            if [ "$ACAO" != "aplicar" ]; then echo "Ação desconhecida: $ACAO"; exit 1; fi
            if grep -q 'proxy_set_header Upgrade' "$SITE"; then
              echo "WebSocket já ligado; nada a fazer."
              exit 0
            fi
            # A cópia fica fora de sites-enabled: lá dentro o nginx carregaria as duas.
            mkdir -p /root/nginx-backups
            COPIA=/root/nginx-backups/$(basename "$SITE").$(date +%Y%m%d%H%M%S)
            cp -a "$SITE" "$COPIA"
            echo "Cópia: $COPIA"
            # O map só manda "upgrade" quando o navegador pede WebSocket; os outros pedidos seguem como antes.
            sed -i '1i map $http_upgrade $lyra_connection_upgrade {\n    default upgrade;\n    "" "";\n}\n' "$SITE"
            sed -i '/proxy_set_header X-Forwarded-Proto \$scheme;/a\        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection $lyra_connection_upgrade;' "$SITE"
            if ! nginx -t; then
              cp -a "$COPIA" "$SITE"
              echo "nginx -t falhou; arquivo original restaurado, nada foi recarregado."
              exit 1
            fi
            systemctl reload nginx
            mostrar "$SITE"
            sleep 2
            code=$(curl -s -o /dev/null -w '%{http_code}' --resolve api.lumensoft.com.br:443:127.0.0.1 https://api.lumensoft.com.br/api/salao/publico/portal/teste-nginx)
            echo "GET /api/salao/publico/portal/teste-nginx -> $code (esperado 404)"
            [ "$code" = "404" ]
