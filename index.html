<!DOCTYPE html>
<html lang="pt-br" class="dark">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%BASE_URL%favicon.svg" />
        <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
        <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Lyra" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#1a1b22" />
        <meta name="description" content="Lyra — Agendamentos" />
        <title>Lyra</title>
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('lyra-theme');
                    if (t === 'light') document.documentElement.classList.remove('dark');
                    else document.documentElement.classList.add('dark');
                } catch (_) {}
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
